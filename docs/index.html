<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Design 27 v4.0.0 — Live Interactive DOM Gallery</title>
  <style>
    :root {
      --surface-canvas: #F4F1EA;
      --surface-elevated: #FFFFFF;
      --ink-primary: #141210;
      --ink-secondary: #4A4640;
      --hairline: rgba(20, 18, 16, 0.16);
      --accent-focal: #1746D1;
      --accent-ink: #FFFFFF;
      --pass: #065F46;
      --fail: #991B1B;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      overflow-x: clip;
      background: var(--surface-canvas);
      color: var(--ink-primary);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: clamp(1rem, 0.2vw + 0.95rem, 1.0625rem);
      line-height: 1.55;
    }
    header, main {
      max-width: 82rem;
      margin-inline: auto;
      padding-inline: clamp(1.25rem, 4vw, 3rem);
    }
    header {
      padding-block: 2.25rem 1.75rem;
      border-bottom: 1px solid var(--hairline);
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: flex-end;
      gap: 1.25rem;
    }
    .eyebrow {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 0.75rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--ink-secondary);
      margin: 0 0 0.5rem;
    }
    h1 {
      margin: 0;
      font-size: clamp(2rem, 4vw, 3.125rem);
      line-height: 1.04;
      letter-spacing: -0.025em;
      text-wrap: balance;
    }
    .controls { display: flex; flex-wrap: wrap; gap: 0.5rem; align-items: center; }
    button {
      font: 600 0.875rem/1 system-ui, sans-serif;
      padding: 0.65rem 1rem;
      border: 1px solid var(--hairline);
      border-radius: 2px;
      background: var(--surface-elevated);
      color: var(--ink-primary);
      cursor: pointer;
      transition: background-color 160ms cubic-bezier(0.16, 1, 0.3, 1), color 160ms, border-color 160ms;
    }
    button[aria-pressed="true"] {
      background: var(--ink-primary);
      color: var(--surface-canvas);
      border-color: var(--ink-primary);
    }
    button:focus-visible, a:focus-visible {
      outline: 2px solid var(--accent-focal);
      outline-offset: 2px;
    }
    .stage-bar {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      padding-block: 1.15rem;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 0.8125rem;
    }
    .pillar-bar {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      padding-bottom: 1rem;
    }
    .badge-pass { color: var(--pass); font-weight: 700; }
    .badge-fail { color: var(--fail); font-weight: 700; }
    .viewport-wrap {
      background: #1B1C20;
      padding: clamp(0.75rem, 2vw, 1.5rem);
      border-radius: 4px;
      display: flex;
      justify-content: center;
      overflow-x: auto;
    }
    iframe {
      width: 100%;
      max-width: 1280px;
      height: 580px;
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 2px;
      background: #fff;
      transition: max-width 220ms cubic-bezier(0.16, 1, 0.3, 1);
    }
    @media (prefers-reduced-motion: reduce) {
      button, iframe { transition: none; }
    }
  </style>
</head>
<body>
  <header>
    <div>
      <p class="eyebrow">Design 27 v4.0.0 · Live Interactive DOM Gallery</p>
      <h1>Inspect real output across pillars and viewports.</h1>
    </div>
    <div class="controls" role="group" aria-label="Toggle Design 27 vs Stock AI Baseline">
      <button id="btn-d27" aria-pressed="true">Design 27 v4.0 Reference (Exit 0)</button>
      <button id="btn-slop" aria-pressed="false">Stock AI Baseline (Exit 2)</button>
    </div>
  </header>
  <main>
    <div class="stage-bar">
      <div id="status" class="badge-pass">d27-check.mjs: EXIT 0 · 0 FLOOR fails · 0 REFLEX warnings</div>
      <div class="controls" role="group" aria-label="Viewport width">
        <button data-width="1280px" aria-pressed="true">Desktop 1280px</button>
        <button data-width="768px" aria-pressed="false">Tablet 768px</button>
        <button data-width="390px" aria-pressed="false">Mobile 390px</button>
      </div>
    </div>
    <div class="pillar-bar">
      <div class="controls" role="group" aria-label="Select fixture pillar">
        <button data-pillar="web" aria-pressed="true">Web + Interactive Gain Bench</button>
        <button data-pillar="mascot" aria-pressed="false">Mascot Cutout Silhouette</button>
        <button data-pillar="thumb" aria-pressed="false">YouTube Thumbnail + 160×90 Feed</button>
      </div>
    </div>
    <div class="viewport-wrap">
      <iframe id="preview" src="../evals/fixtures/design27-saas.html" title="Live rendered fixture"></iframe>
    </div>
  </main>
  <script>
    const FIXTURES = {
      web: {
        d27: "../evals/fixtures/design27-saas.html",
        slop: "../evals/fixtures/slop-saas.html",
        passText: "d27-check.mjs: EXIT 0 · 0 FLOOR fails · 0 REFLEX warnings (Web + Interactive Proof)",
        failText: "d27-check.mjs: EXIT 2 · 6 FLOOR fails · 5 REFLEX warnings (Stock AI Web Slop)"
      },
      mascot: {
        d27: "../evals/fixtures/clean-mascot.html",
        slop: "../evals/fixtures/slop-mascot.html",
        passText: "d27-check.mjs --medium=mascot: EXIT 0 · 6 named <g id> groups · --m-cut verified",
        failText: "d27-check.mjs --medium=mascot: EXIT 2 · blind brightness(0) + missing <g id> groups"
      },
      thumb: {
        d27: "../evals/fixtures/clean-thumb.html",
        slop: "../evals/fixtures/slop-thumb.html",
        passText: "d27-check.mjs --medium=thumbnail: EXIT 0 · 3-word hook · 14:28 dead-zone clear",
        failText: "d27-check.mjs --medium=thumbnail: EXIT 2 · 9-word ceiling fail + dead-zone collision"
      }
    };

    const iframe = document.getElementById("preview");
    const status = document.getElementById("status");
    const btnD27 = document.getElementById("btn-d27");
    const btnSlop = document.getElementById("btn-slop");

    let activePillar = "web";
    let activeVariant = "d27";

    function renderFrame() {
      const cfg = FIXTURES[activePillar];
      iframe.src = cfg[activeVariant];
      const isPass = activeVariant === "d27";
      btnD27.setAttribute("aria-pressed", String(isPass));
      btnSlop.setAttribute("aria-pressed", String(!isPass));
      status.className = isPass ? "badge-pass" : "badge-fail";
      status.textContent = isPass ? cfg.passText : cfg.failText;
    }

    btnD27.addEventListener("click", () => {
      activeVariant = "d27";
      renderFrame();
    });
    btnSlop.addEventListener("click", () => {
      activeVariant = "slop";
      renderFrame();
    });
    document.querySelectorAll("[data-pillar]").forEach((btn) => {
      btn.addEventListener("click", () => {
        activePillar = btn.dataset.pillar;
        document.querySelectorAll("[data-pillar]").forEach((b) => b.setAttribute("aria-pressed", String(b === btn)));
        renderFrame();
      });
    });
    document.querySelectorAll("[data-width]").forEach((btn) => {
      btn.addEventListener("click", () => {
        iframe.style.maxWidth = btn.dataset.width;
        document.querySelectorAll("[data-width]").forEach((b) => b.setAttribute("aria-pressed", String(b === btn)));
      });
    });
  </script>
</body>
</html>
