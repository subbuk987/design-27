<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="1200" height="440" data-asset="verified" role="img" aria-label="Before vs After Design 27 v4.0 Pillars: Mascot Cutouts, Thumbnail Dead-Zone Proof, and Humanized Book Typography">
  <defs>
    <clipPath id="clip-slop-thumb">
      <rect x="0" y="0" width="248" height="140" rx="6"/>
    </clipPath>
    <clipPath id="clip-d27-thumb">
      <rect x="0" y="0" width="248" height="140" rx="6"/>
    </clipPath>
  </defs>

  <!-- Outer Stage -->
  <rect width="1200" height="440" fill="#111214"/>

  <!-- ===================================================================== -->
  <!-- LEFT PANEL: WITHOUT DESIGN 27 (STOCK AI SLOP)                         -->
  <!-- ===================================================================== -->
  <g transform="translate(24, 24)">
    <rect width="564" height="392" rx="10" fill="#131620" stroke="#2D3348" stroke-width="1"/>
    <!-- Header Bar -->
    <rect x="0" y="0" width="564" height="36" rx="10" fill="#1B2030"/>
    <rect x="0" y="26" width="564" height="10" fill="#1B2030"/>
    <text x="18" y="22" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" font-weight="700" fill="#F87171">WITHOUT DESIGN 27 — STOCK AI SLOP</text>
    <rect x="444" y="8" width="104" height="20" rx="4" fill="#7F1D1D"/>
    <text x="496" y="21.5" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10" font-weight="700" fill="#FECACA">EXIT 2 · FAILS</text>

    <!-- ROW 1A: Blind Silhouette Mascot (brightness(0) blob) -->
    <g transform="translate(20, 52)">
      <rect width="248" height="140" rx="6" fill="#1B2030" stroke="#334155"/>
      <text x="12" y="20" font-family="ui-monospace, monospace" font-size="9.5" font-weight="700" fill="#94A3B8">MASCOT · 64PX SILHOUETTE</text>
      <!-- Crushed solid black blob -->
      <rect x="24" y="42" width="64" height="64" rx="12" fill="#000000"/>
      <rect x="18" y="54" width="6" height="8" rx="1" fill="#000000"/>
      <rect x="18" y="70" width="6" height="8" rx="1" fill="#000000"/>
      <rect x="88" y="54" width="6" height="8" rx="1" fill="#000000"/>
      <rect x="88" y="70" width="6" height="8" rx="1" fill="#000000"/>
      <text x="108" y="58" font-family="ui-monospace, monospace" font-size="10" fill="#FCA5A5">filter: brightness(0)</text>
      <text x="108" y="74" font-family="system-ui, sans-serif" font-size="11" fill="#CBD5E1">Crushes eyes &amp; mouth</text>
      <text x="108" y="90" font-family="system-ui, sans-serif" font-size="11" fill="#CBD5E1">into a blind black blob.</text>
      <text x="12" y="126" font-family="ui-monospace, monospace" font-size="9.5" fill="#F87171">[FLOOR] no-blind-silhouette-filter</text>
    </g>

    <!-- ROW 1B: Cluttered Thumbnail Colliding with 14:28 Dead Zone -->
    <g transform="translate(296, 52)">
      <g clip-path="url(#clip-slop-thumb)">
        <rect width="248" height="140" fill="#1E1B4B"/>
        <circle cx="195" cy="40" r="64" fill="#6366F1" fill-opacity="0.35"/>
        <text x="12" y="20" font-family="ui-monospace, monospace" font-size="9.5" font-weight="700" fill="#C7D2FE">THUMBNAIL · 160×90 FEED</text>
        <!-- 9-word title-repeating headline colliding with bottom-right dead zone -->
        <text x="16" y="64" font-family="system-ui, sans-serif" font-size="13.5" font-weight="800" fill="#E2E8F0">Why Our New CPU</text>
        <text x="16" y="82" font-family="system-ui, sans-serif" font-size="13.5" font-weight="800" fill="#E2E8F0">Benchmark Tool Changes</text>
        <text x="102" y="122" font-family="system-ui, sans-serif" font-size="13.5" font-weight="800" fill="#FDE047">Everything Today!</text>
        <!-- YouTube 14:28 Dead Zone Pill -->
        <rect x="184" y="110" width="54" height="22" rx="4" fill="#000000" fill-opacity="0.88" stroke="#EF4444" stroke-width="1.2"/>
        <text x="211" y="125" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10.5" font-weight="700" fill="#FFFFFF">14:28</text>
      </g>
      <rect width="248" height="140" rx="6" fill="none" stroke="#EF4444" stroke-width="1"/>
    </g>

    <!-- ROW 2: Book Slop Prose -->
    <g transform="translate(20, 206)">
      <rect width="524" height="114" rx="6" fill="#1B2030" stroke="#334155"/>
      <text x="14" y="22" font-family="ui-monospace, monospace" font-size="9.5" font-weight="700" fill="#94A3B8">BOOK CHAPTER · AI PROSE TELLS + DOUBLE-SIGNALED PARAGRAPHS</text>
      <text x="14" y="46" font-family="Georgia, serif" font-size="12.5" fill="#E2E8F0">Moreover, let us <tspan fill="#FCA5A5" text-decoration="underline">delve</tspan> into this <tspan fill="#FCA5A5" text-decoration="underline">pivotal tapestry</tspan>. It is</text>
      <text x="14" y="64" font-family="Georgia, serif" font-size="12.5" fill="#E2E8F0"><tspan fill="#FDE047" text-decoration="underline">not just a database — it is a paradigm</tspan> shift that</text>
      <text x="14" y="84" font-family="Georgia, serif" font-size="12.5" fill="#94A3B8">     Furthermore, it underscores a vibrant realm...</text>
      <text x="14" y="104" font-family="ui-monospace, monospace" font-size="9.5" fill="#F87171">[FLOOR] no-ai-slop-vocabulary · [REFLEX] no-negative-parallelism-tic</text>
    </g>

    <!-- Bottom Redline -->
    <rect x="20" y="332" width="524" height="44" rx="6" fill="#450A0A" stroke="#DC2626"/>
    <text x="34" y="350" font-family="ui-monospace, monospace" font-size="10.5" font-weight="700" fill="#FCA5A5">d27-check v4: blind-silhouette · thumbnail-word-ceiling (9 &gt; 5)</text>
    <text x="34" y="366" font-family="ui-monospace, monospace" font-size="10" fill="#FECACA">thumbnail-deadzone-collision · ai-slop-vocabulary · throat-clearing</text>
  </g>

  <!-- ===================================================================== -->
  <!-- RIGHT PANEL: WITH DESIGN 27 v4.0                                      -->
  <!-- ===================================================================== -->
  <g transform="translate(612, 24)">
    <rect width="564" height="392" rx="10" fill="#F4F1EA" stroke="#27272A" stroke-width="1"/>
    <!-- Header Bar -->
    <rect x="0" y="0" width="564" height="36" rx="10" fill="#141210"/>
    <rect x="0" y="26" width="564" height="10" fill="#141210"/>
    <text x="18" y="22" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" font-weight="700" fill="#ECEEF2">WITH DESIGN 27 v4.0 — CRAFT + FLOOR</text>
    <rect x="444" y="8" width="104" height="20" rx="4" fill="#064E3B"/>
    <text x="496" y="21.5" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10" font-weight="700" fill="#A7F3D0">EXIT 0 · CLEAN</text>

    <!-- ROW 1A: Mascot 64px Negative-Space Cutout Silhouette -->
    <g transform="translate(20, 52)">
      <rect width="248" height="140" rx="6" fill="#FFFFFF" stroke="#141210" stroke-opacity="0.16"/>
      <text x="12" y="20" font-family="ui-monospace, monospace" font-size="9.5" font-weight="700" fill="#4A4640">MASCOT · 64PX CUTOUT (--m-cut)</text>
      <!-- 64px Pulsebit Negative-Space Cutout Silhouette -->
      <g transform="translate(24, 42)">
        <rect x="0" y="0" width="64" height="64" rx="12" fill="#141210"/>
        <!-- IC Pins -->
        <rect x="-6" y="14" width="6" height="6" rx="1" fill="#141210"/>
        <rect x="-6" y="28" width="6" height="6" rx="1" fill="#141210"/>
        <rect x="-6" y="42" width="6" height="6" rx="1" fill="#141210"/>
        <rect x="64" y="14" width="6" height="6" rx="1" fill="#141210"/>
        <rect x="64" y="28" width="6" height="6" rx="1" fill="#141210"/>
        <rect x="64" y="42" width="6" height="6" rx="1" fill="#141210"/>
        <!-- Cutout >_ Terminal Eyes & ECG Mouth punched in m-cut (#FFFFFF) -->
        <polyline points="15,18 25,24 15,30" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
        <line x1="34" y1="30" x2="48" y2="30" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round"/>
        <polyline points="14,47 24,47 28,40 34,53 39,47 50,47" fill="none" stroke="#FFFFFF" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
      <text x="108" y="58" font-family="ui-monospace, monospace" font-size="10" font-weight="700" fill="#065F46">--m-cut negative space</text>
      <text x="108" y="74" font-family="system-ui, sans-serif" font-size="11" fill="#141210">&gt;_ prompt eyes &amp; ECG</text>
      <text x="108" y="90" font-family="system-ui, sans-serif" font-size="11" fill="#141210">punch clean at 64px/16px.</text>
      <text x="12" y="126" font-family="ui-monospace, monospace" font-size="9.5" fill="#065F46">6 named &lt;g id&gt; groups · 0 fails</text>
    </g>

    <!-- ROW 1B: Crisp 3-Word Curiosity-Gap Thumbnail Clearing 14:28 Dead Zone -->
    <g transform="translate(296, 52)">
      <g clip-path="url(#clip-d27-thumb)">
        <rect width="248" height="140" fill="#111318"/>
        <line x1="0" y1="104" x2="248" y2="104" stroke="#27272A" stroke-width="1"/>
        <text x="12" y="20" font-family="ui-monospace, monospace" font-size="9.5" font-weight="700" fill="#93C5FD">THUMBNAIL · 3-WORD HOOK</text>
        <!-- Crisp 3-word hook clear of bottom-right dead zone -->
        <text x="16" y="62" font-family="system-ui, sans-serif" font-size="22" font-weight="900" letter-spacing="-0.03em" fill="#FFFFFF">0.4ms</text>
        <text x="16" y="86" font-family="system-ui, sans-serif" font-size="16" font-weight="800" fill="#3B82F6">COLD START</text>
        <!-- Right focal graph bar (safely above dead zone) -->
        <rect x="164" y="42" width="16" height="54" rx="2" fill="#334155"/>
        <rect x="188" y="72" width="16" height="24" rx="2" fill="#3B82F6"/>
        <rect x="212" y="88" width="16" height="8" rx="2" fill="#10B981"/>
        <!-- Clear 14:28 Dead Zone Pill -->
        <rect x="184" y="110" width="54" height="22" rx="4" fill="#000000" fill-opacity="0.88" stroke="#10B981" stroke-width="1"/>
        <text x="211" y="125" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10.5" font-weight="700" fill="#FFFFFF">14:28</text>
      </g>
      <rect width="248" height="140" rx="6" fill="none" stroke="#141210" stroke-opacity="0.25"/>
    </g>

    <!-- ROW 2: Humanized Monograph Book Typography -->
    <g transform="translate(20, 206)">
      <rect width="524" height="114" rx="6" fill="#FFFFFF" stroke="#141210" stroke-opacity="0.16"/>
      <text x="14" y="22" font-family="ui-monospace, monospace" font-size="9.5" font-weight="700" fill="#4A4640">BOOK CHAPTER · COLD-OPEN TELEMETRY + TUFTE SIDENOTE</text>
      <text x="14" y="48" font-family="Georgia, serif" font-size="13" fill="#141210">At 03:14 UTC, the write-ahead log queue stalled for</text>
      <text x="14" y="66" font-family="Georgia, serif" font-size="13" fill="#141210">412 milliseconds.<tspan font-size="9" dy="-4" fill="#1746D1">1</tspan><tspan dy="4"> Every thread waited on a single mutex.</tspan></text>
      <line x1="366" y1="30" x2="366" y2="90" stroke="#141210" stroke-opacity="0.14"/>
      <text x="378" y="46" font-family="ui-monospace, monospace" font-size="9" fill="#1746D1">1. nvme0n1 fsync trace</text>
      <text x="378" y="60" font-family="system-ui, sans-serif" font-size="10" fill="#4A4640">p99 jumped 14× when</text>
      <text x="378" y="74" font-family="system-ui, sans-serif" font-size="10" fill="#4A4640">checkpointing collided.</text>
      <text x="14" y="102" font-family="ui-monospace, monospace" font-size="9.5" fill="#065F46">Zero AI prose tells · First-line indent XOR margin · ≥ 4.5:1 vellum</text>
    </g>

    <!-- Clean Verification Strip -->
    <rect x="20" y="332" width="524" height="44" rx="6" fill="#ECFDF5" stroke="#059669"/>
    <text x="34" y="350" font-family="ui-monospace, monospace" font-size="10.5" font-weight="700" fill="#065F46">d27-check v4: 0 FLOOR fails · 0 REFLEX warnings across all 6 pillars</text>
    <text x="34" y="366" font-family="ui-monospace, monospace" font-size="10" fill="#047857">Cutout --m-cut verified · 160×90 dead-zone clear · Zero-dep CDP render</text>
  </g>
</svg>
