<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="1200" height="440" role="img" aria-label="Before vs After 16:9 Pitch Deck Slide comparison: Stock AI vs Design 27">
  <rect width="1200" height="440" fill="#111214"/>

  <!-- LEFT: STOCK AI SLIDE -->
  <g transform="translate(24, 24)">
    <rect width="564" height="392" rx="8" fill="#ffffff" stroke="#334155"/>
    <rect width="564" height="34" rx="8" fill="#1e293b"/>
    <rect y="24" width="564" height="10" fill="#1e293b"/>
    <text x="16" y="21" font-family="ui-monospace, monospace" font-size="11.5" font-weight="700" fill="#f87171">WITHOUT DESIGN 27 — STOCK AI SLIDE</text>

    <!-- Weak Topic Label -->
    <text x="28" y="72" font-family="system-ui, sans-serif" font-size="20" font-weight="700" fill="#1e293b">Q3 Retention Overview</text>
    <line x1="28" y1="84" x2="536" y2="84" stroke="#e2e8f0"/>

    <!-- Bullet Wall Left -->
    <g font-family="system-ui, sans-serif" font-size="11.5" fill="#475569">
      <text x="28" y="114">• Customers really liked our new onboarding</text>
      <text x="28" y="138">• Retention improved across multiple segments</text>
      <text x="28" y="162">• Enterprise accounts grew faster in Q3</text>
      <text x="28" y="186">• Support tickets decreased after launch</text>
      <text x="28" y="210">• Self-serve flows helped activation rates</text>
      <text x="28" y="234">• Team plans to iterate further in Q4</text>
    </g>

    <!-- Rainbow Cluttered Chart Right -->
    <g transform="translate(300, 110)">
      <rect width="236" height="170" fill="#f8fafc" stroke="#cbd5e1"/>
      <rect x="24" y="110" width="24" height="40" fill="#ef4444"/>
      <rect x="64" y="96" width="24" height="54" fill="#f59e0b"/>
      <rect x="104" y="86" width="24" height="64" fill="#10b981"/>
      <rect x="144" y="64" width="24" height="86" fill="#3b82f6"/>
      <rect x="184" y="42" width="24" height="108" fill="#a855f7"/>
      <text x="118" y="24" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#64748b">Q1  Q2  Q3  Q4  Est</text>
    </g>

    <!-- Bottom Critique -->
    <rect x="24" y="330" width="516" height="42" rx="4" fill="#fef2f2" stroke="#fca5a5"/>
    <text x="36" y="355" font-family="ui-monospace, monospace" font-size="10.5" fill="#991b1b">Vague topic title · 6-bullet text wall · rainbow bars · distant legend</text>
  </g>

  <!-- RIGHT: DESIGN 27 16:9 SLIDE -->
  <g transform="translate(612, 24)">
    <rect width="564" height="392" rx="8" fill="#0B0C10" stroke="#27272A"/>
    <rect width="564" height="34" rx="8" fill="#14161D"/>
    <rect y="24" width="564" height="10" fill="#14161D"/>
    <text x="16" y="21" font-family="ui-monospace, monospace" font-size="11.5" font-weight="700" fill="#a7f3d0">WITH DESIGN 27 v3.0 — 16:9 DATA SLIDE</text>

    <!-- Assertion Title -->
    <text x="32" y="64" font-family="ui-monospace, monospace" font-size="9.5" letter-spacing="0.12em" fill="#9CA3AF">NET DOLLAR RETENTION · Q1–Q3 2026</text>
    <text x="32" y="92" font-family="system-ui, sans-serif" font-size="21" font-weight="700" fill="#ECEEF2">Enterprise renewals rose 38% after</text>
    <text x="32" y="116" font-family="system-ui, sans-serif" font-size="21" font-weight="700" fill="#ECEEF2">self-serve onboarding shipped in May.</text>

    <!-- Spotlight Chart (>= 68% Width, Muted Baselines + 1 Focal Accent) -->
    <g transform="translate(32, 142)">
      <line x1="0" y1="30" x2="364" y2="30" stroke="#ECEEF2" stroke-opacity="0.1"/>
      <line x1="0" y1="80" x2="364" y2="80" stroke="#ECEEF2" stroke-opacity="0.1"/>
      <line x1="0" y1="130" x2="364" y2="130" stroke="#ECEEF2" stroke-opacity="0.18"/>

      <!-- Muted Baseline Series (SMB) -->
      <polyline points="10,114 96,110 182,108 268,105 354,102" fill="none" stroke="#6B7280" stroke-width="2"/>
      <text x="364" y="106" font-family="ui-monospace, monospace" font-size="10" fill="#9CA3AF">SMB 104%</text>

      <!-- Focal Spotlight Series (Enterprise) -->
      <polyline points="10,104 96,98 182,94 268,54 354,28" fill="none" stroke="#F59E0B" stroke-width="3.2"/>
      <circle cx="182" cy="94" r="4" fill="#0B0C10" stroke="#F59E0B" stroke-width="2"/>
      <circle cx="354" cy="28" r="5" fill="#F59E0B"/>
      <text x="364" y="32" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#F59E0B">ENT 138%</text>

      <!-- Inflection Callout -->
      <line x1="182" y1="94" x2="182" y2="16" stroke="#F59E0B" stroke-dasharray="3,3" stroke-opacity="0.6"/>
      <text x="190" y="24" font-family="ui-monospace, monospace" font-size="9.5" fill="#FDE68A">May launch</text>

      <!-- X Axis -->
      <g font-family="ui-monospace, monospace" font-size="9.5" fill="#9CA3AF">
        <text x="10" y="148">JAN</text><text x="90" y="148">MAR</text><text x="174" y="148">MAY</text><text x="260" y="148">JUL</text><text x="344" y="148">SEP</text>
      </g>
    </g>

    <!-- Single Callout Metric Right -->
    <g transform="translate(432, 180)">
      <line x1="0" y1="0" x2="0" y2="108" stroke="#ECEEF2" stroke-opacity="0.16"/>
      <text x="16" y="34" font-family="ui-monospace, monospace" font-size="30" font-weight="700" fill="#F59E0B">+38%</text>
      <text x="16" y="54" font-family="system-ui, sans-serif" font-size="11" fill="#ECEEF2">vs. Q1 baseline</text>
      <text x="16" y="84" font-family="system-ui, sans-serif" font-size="10.5" fill="#9CA3AF">Zero added headcount</text>
    </g>

    <!-- Quiet Footer Rail -->
    <line x1="32" y1="354" x2="532" y2="354" stroke="#ECEEF2" stroke-opacity="0.14"/>
    <text x="32" y="374" font-family="ui-monospace, monospace" font-size="9.5" fill="#9CA3AF">Q3 BOARD REVIEW · SOURCE: STRIPE BILLING LEDGER</text>
    <text x="532" y="374" text-anchor="end" font-family="ui-monospace, monospace" font-size="9.5" fill="#9CA3AF">07</text>
