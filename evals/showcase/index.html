<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Showcase Benchmark — 5 categories × 8 contenders</title>
<style>
  :root { --bg:#f4f3ef; --ink:#151515; --mute:#4a4945; --line:#d9d7d0; --acc:#1f4fd6; }
  * { box-sizing:border-box; }
  html, body { margin:0; overflow-x:clip; background:var(--bg); color:var(--ink); font:16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { display:flex; flex-wrap:wrap; gap:12px 24px; align-items:center; justify-content:space-between; padding:16px 24px; border-bottom:1px solid var(--line); position:sticky; top:0; background:var(--bg); z-index:2; }
  h1 { font-size:16px; margin:0; font-weight:650; }
  [role=tablist] { display:flex; flex-wrap:wrap; gap:4px; }
  [role=tab] { font:inherit; border:1px solid var(--line); background:#fff; padding:6px 14px; border-radius:6px; cursor:pointer; }
  [role=tab][aria-selected=true] { background:var(--ink); color:#fff; border-color:var(--ink); }
  button:focus-visible, a:focus-visible, input:focus-visible { outline:2px solid var(--acc); outline-offset:2px; }
  label { display:flex; gap:8px; align-items:center; cursor:pointer; }
  main { padding:24px; }
  .note { color:var(--mute); margin:0 0 16px; max-width:70ch; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(min(100%, 420px), 1fr)); gap:20px; }
  .card { background:#fff; border:1px solid var(--line); border-radius:8px; overflow:hidden; }
  .card h2 { font-size:14px; margin:0; padding:10px 14px; display:flex; justify-content:space-between; border-bottom:1px solid var(--line); }
  .card h2 a { color:var(--acc); font-weight:500; }
  .frame { position:relative; overflow:hidden; background:#eee; }
  .frame iframe { position:absolute; top:0; left:0; border:0; transform-origin:0 0; }
  .missing { padding:40px 14px; color:var(--mute); text-align:center; }
</style>
</head>
<body>
<header>
  <h1>Showcase Benchmark · Design 27 v4.0.0 Categories</h1>
  <div role="tablist" aria-label="Category" id="tabs"></div>
  <label><input type="checkbox" id="blind"> Blind Mode</label>
</header>
<main>
  <p class="note">Each card is the contender's own <code>index.html</code>, rendered at its native viewport and scaled to fit. Blind Mode hides skill names and shuffles card order with a fixed seed. Prompts: <a href="PROMPTS.md">PROMPTS.md</a>. Static floor results: <a href="RESULTS.md">RESULTS.md</a>.</p>
  <div class="grid" id="grid"></div>
</main>
<script>
const CONTENDERS = ["none","design-27","hyperframes","impeccable","hallmark","unslop","remotion-skills","frontend-design"];
// Filled by the parent run after all batches: contenders that produced a file, per category.
const PRESENT = /*PRESENT*/{"web":["design-27","frontend-design","hallmark","hyperframes","impeccable","none","remotion-skills"],"illustration":["design-27","frontend-design","hallmark","hyperframes","impeccable","none","remotion-skills"],"thumbnail":[],"motion":[],"book":[]}/*END*/;
const CATS = [
  { id:"web", label:"Web", w:1280, h:800 },
  { id:"illustration", label:"Mascot / Illustration", w:1280, h:800 },
  { id:"thumbnail", label:"Thumbnail", w:1280, h:720 },
  { id:"motion", label:"Motion", w:1280, h:720 },
  { id:"book", label:"Book", w:1280, h:900 },
];
const tabs = document.getElementById("tabs"), grid = document.getElementById("grid"), blind = document.getElementById("blind");
let cur = CATS[0];

// Deterministic shuffle so blind order is the same for every judge.
function shuffled(arr, seed) {
  const a = arr.slice(); let s = seed;
  for (let i = a.length - 1; i > 0; i--) { s = (s * 1103515245 + 12345) % 2147483648; const j = s % (i + 1); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}

function render() {
  const isBlind = blind.checked;
  const present = PRESENT[cur.id] || [];
  const list = isBlind ? shuffled(present, cur.id.length * 7919) : CONTENDERS;
  grid.innerHTML = "";
  list.forEach((c, i) => {
    const name = isBlind ? "Entry " + String.fromCharCode(65 + i) : c;
    const card = document.createElement("article"); card.className = "card";
    const src = cur.id + "/" + c + "/index.html";
    if (!present.includes(c)) {
      card.innerHTML = `<h2><span>${name}</span></h2><div class="missing">NOT_INSTALLED — no file</div>`;
    } else {
      card.innerHTML = `<h2><span>${name}</span><a href="${src}" target="_blank" rel="noopener">Open ↗</a></h2>
        <div class="frame" style="aspect-ratio:${cur.w}/${cur.h}"><iframe loading="lazy" title="${name}" src="${src}" width="${cur.w}" height="${cur.h}"></iframe></div>`;
    }
    grid.appendChild(card);
  });
  fit();
}

function fit() {
  grid.querySelectorAll(".frame").forEach(f => { f.firstElementChild.style.transform = `scale(${f.clientWidth / cur.w})`; });
}

CATS.forEach(c => {
  const b = document.createElement("button"); b.role = "tab"; b.textContent = c.label;
  b.setAttribute("aria-selected", c === cur);
  b.onclick = () => { cur = c; tabs.querySelectorAll("[role=tab]").forEach(t => t.setAttribute("aria-selected", t === b)); render(); };
  tabs.appendChild(b);
});
blind.onchange = render;
new ResizeObserver(fit).observe(grid);
render();
</script>
</body>
</html>
