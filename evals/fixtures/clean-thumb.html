<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>0.4ms Cold Start — Design 27 v4.0 Thumbnail + Feed Proof</title>
  <style>
    :root {
      --surface-canvas: #121316;
      --surface-elevated: #1A1C22;
      --ink-primary: #F6F5F0;
      --ink-secondary: #B8B5AC;
      --accent-focal: #3B82F6;
      --accent-ink: #FFFFFF;
      --hairline: rgba(246, 245, 240, 0.16);
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      overflow-x: clip;
      background: var(--surface-canvas);
      color: var(--ink-primary);
      font-family: system-ui, -apple-system, sans-serif;
      font-size: clamp(1rem, 0.2vw + 0.95rem, 1.0625rem);
      line-height: 1.5;
    }
    main {
      max-width: 84rem;
      margin-inline: auto;
      padding: clamp(1rem, 3vw, 2rem);
      display: grid;
      gap: 1.5rem;
    }
    .yt-thumb {
      position: relative;
      width: 100%;
      max-width: 1280px;
      aspect-ratio: 16 / 9;
      background: #0D0F14;
      border: 1px solid var(--hairline);
      border-radius: 6px;
      overflow: hidden;
    }
    .yt-thumb h1 {
      position: absolute;
      left: 5%;
      top: 25%;
      margin: 0;
      max-width: 54%;
      font-size: clamp(2.1rem, 7vw, 6.25rem);
      font-weight: 900;
      line-height: 0.92;
      letter-spacing: -0.03em;
      color: #FFFFFF;
    }
    .yt-thumb h1 span { color: #60A5FA; display: block; }
    .thumb-art {
      position: absolute;
      right: 7%;
      top: 16%;
      width: 34%;
      height: auto;
    }
    .feed-row {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      align-items: center;
      background: var(--surface-elevated);
      border: 1px solid var(--hairline);
      border-radius: 6px;
      padding: 1rem;
      max-width: 540px;
    }
    .feed-mini {
      position: relative;
      width: 160px;
      height: 90px;
      background: #0D0F14;
      border-radius: 4px;
      overflow: hidden;
      flex-shrink: 0;
      padding: 12px 10px;
    }
    .feed-mini strong {
      display: block;
      font-size: 16px;
      line-height: 0.95;
      font-weight: 900;
      color: #FFFFFF;
    }
    .feed-mini strong span { color: #60A5FA; display: block; }
    .timestamp {
      position: absolute;
      right: 5px;
      bottom: 5px;
      background: rgba(0, 0, 0, 0.88);
      color: #FFFFFF;
      font-family: ui-monospace, monospace;
      font-size: 10px;
      font-weight: 700;
      padding: 2px 4px;
      border-radius: 2px;
    }
    .feed-meta h2 { font-size: 1rem; margin: 0 0 0.25rem; }
    .feed-meta p { font-size: 0.875rem; color: var(--ink-secondary); margin: 0; }
  </style>
</head>
<body>
  <main>
    <section class="yt-thumb" data-thumbnail="true" aria-label="1280x720 YouTube thumbnail canvas">
      <h1>0.4ms <span>COLD START</span></h1>
      <svg class="thumb-art" data-asset="verified" viewBox="0 0 240 180" width="240" height="180" role="img" aria-label="Benchmark comparison bars">
        <g id="bars">
          <rect x="20" y="20" width="44" height="130" rx="4" fill="#334155"/>
          <rect x="92" y="88" width="44" height="62" rx="4" fill="#3B82F6"/>
          <rect x="164" y="132" width="44" height="18" rx="4" fill="#10B981"/>
        </g>
      </svg>
    </section>

    <aside class="feed-row" aria-label="160x90 YouTube feed context preview">
      <div class="feed-mini">
        <strong>0.4ms <span>COLD START</span></strong>
        <span class="timestamp">14:28</span>
      </div>
      <div class="feed-meta">
        <h2>I Replaced Our Rust Profiler With a 4KB Binary</h2>
        <p>Systems Engineering · 160×90 squint + 14:28 dead-zone check</p>
      </div>
    </aside>
  </main>
</body>
</html>
