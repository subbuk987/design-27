<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Kestrel Field Recorder — Design 27 Reference</title>
  <style>
    :root {
      --surface-canvas: #F4F1EA;
      --surface-elevated: #FFFFFF;
      --ink-primary: #141210;
      --ink-secondary: #4A4640;
      --hairline: rgba(20, 18, 16, 0.16);
      --accent-focal: #1746D1;
      --accent-ink: #FFFFFF;
    }
    html, body {
      margin: 0;
      overflow-x: clip;
      background: var(--surface-canvas);
      color: var(--ink-primary);
      font-family: system-ui, -apple-system, sans-serif;
      font-size: clamp(1rem, 0.25vw + 0.95rem, 1.125rem);
      line-height: 1.6;
    }
    .hero {
      max-width: 80rem;
      margin-inline: auto;
      padding: clamp(2rem, 5vw, 4.5rem);
      display: grid;
      grid-template-columns: minmax(0, 7fr) minmax(0, 5fr);
      gap: 2rem;
    }
    h1 { font-size: clamp(2.5rem, 5vw, 4.25rem); line-height: 1.02; text-wrap: balance; min-width: 0; overflow-wrap: break-word; margin: 0 0 1rem; }
    .cta {
      display: inline-block;
      padding: 0.75rem 1.5rem;
      background: var(--accent-focal);
      color: var(--accent-ink);
      text-decoration: none;
      border-radius: 2px;
      transition: opacity 180ms cubic-bezier(0.16, 1, 0.3, 1);
    }
    .cta:focus-visible { outline: 2px solid var(--accent-focal); outline-offset: 3px; }
    @media (prefers-reduced-motion: reduce) {
      .cta { transition: none; }
    }
  </style>
</head>
<body>
  <main class="hero">
    <div>
      <h1>Capture rain, never clip.</h1>
      <p>Offline 32-bit float documentary recorder machined from anodized aluminum.</p>
      <a class="cta" href="#specs">Download Specs</a>
    </div>
  </main>
</body>
</html>
