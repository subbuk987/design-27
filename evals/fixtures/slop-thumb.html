<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Thumbnail Slop Baseline</title>
  <style>
    body { margin: 0; background: #0f172a; color: #f8fafc; font-family: system-ui, sans-serif; font-size: 16px; }
    .yt-thumb {
      position: relative;
      width: 1280px;
      height: 720px;
      background: linear-gradient(135deg, #312e81, #581c87);
    }
    .yt-thumb h1 {
      position: absolute;
      right: 24px;
      bottom: 24px;
      margin: 0;
      max-width: 520px;
      font-size: 48px;
      line-height: 1.05;
      color: #fde047;
      text-align: right;
    }
  </style>
</head>
<body>
  <div class="yt-thumb">
    <h1>Why Our New CPU Benchmark Tool Changes Everything Today</h1>
  </div>
</body>
</html>
