<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Clean Seekable Motion Fixture</title>
  <style>
    /* D27-Lock: Experience | academy-film-leader | seekable-stage | frame-gate-counter | d27Seek-scrubber | scale | M:5 I:5 H:5 C:5 R:4 */
    :root {
      --surface-canvas: #121316;
      --ink-primary: #F4F1EA;
      --ink-secondary: #B8B3A8;
      --accent-focal: #E5A00D;
    }
    body {
      margin: 0;
      width: 100%;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: system-ui, sans-serif;
      font-size: 18px;
      background: var(--surface-canvas);
      color: var(--ink-primary);
      overflow-x: clip;
    }
    #stage {
      width: 100%;
      max-width: 960px;
      padding: 48px;
      box-sizing: border-box;
    }
    #headline {
      margin: 0;
      font-size: 64px;
      line-height: 1.05;
      letter-spacing: -0.02em;
    }
    #timecode {
      margin-top: 16px;
      font-family: ui-monospace, monospace;
      color: var(--ink-secondary);
    }
  </style>
</head>
<body>
  <main id="stage">
    <h1 id="headline">FRAME LOCKED</h1>
    <div id="timecode">00:00.00</div>
  </main>
  <script>
    function mulberry32(seed) {
      let a = seed >>> 0;
      return () => {
        a |= 0;
        a = (a + 0x6D2B79F5) | 0;
        let t = Math.imul(a ^ (a >>> 15), 1 | a);
        t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      };
    }

    const headline = document.getElementById("headline");
    const timecode = document.getElementById("timecode");
    const easeOutExpo = (x) => (x >= 1 ? 1 : 1 - Math.pow(2, -10 * x));

    window.__d27Seek = function seek(tSeconds) {
      const t = Math.max(0, Number(tSeconds) || 0);
      const progress = Math.min(1, t / 1.2);
      const eased = easeOutExpo(progress);
      const rng = mulberry32(2704);
      const microOffset = (rng() - 0.5) * 0.5 * (1 - eased);
      const y = (1 - eased) * 28 + microOffset;
      headline.style.transform = `translate3d(0, ${y.toFixed(2)}px, 0)`;
      headline.style.opacity = String(Math.min(1, 0.15 + eased * 0.85));
      timecode.textContent = `00:${t.toFixed(2).padStart(5, "0")}`;
      return { t, progress };
    };

    window.__d27Seek(0);
  </script>
</body>
</html>
