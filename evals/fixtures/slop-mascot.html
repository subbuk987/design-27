<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pulsebit Mascot — Stock Blind Silhouette Baseline</title>
  <style>
    body { margin: 0; padding: 32px; background: #0f172a; color: #e2e8f0; font-family: system-ui, sans-serif; font-size: 16px; }
    .sil { filter: brightness(0); width: 64px; height: 64px; }
  </style>
</head>
<body>
  <main>
    <h1>Pulsebit Mascot</h1>
    <svg viewBox="0 0 400 400" width="240" height="240">
      <rect x="70" y="70" width="260" height="260" rx="36" fill="#ff5b1f"/>
      <rect x="44" y="120" width="26" height="20" fill="#94a3b8"/>
      <rect x="44" y="160" width="26" height="20" fill="#94a3b8"/>
      <rect x="44" y="200" width="26" height="20" fill="#94a3b8"/>
      <rect x="44" y="240" width="26" height="20" fill="#94a3b8"/>
      <rect x="330" y="120" width="26" height="20" fill="#94a3b8"/>
      <rect x="330" y="160" width="26" height="20" fill="#94a3b8"/>
      <rect x="330" y="200" width="26" height="20" fill="#94a3b8"/>
      <rect x="330" y="240" width="26" height="20" fill="#94a3b8"/>
      <rect x="110" y="115" width="180" height="170" rx="18" fill="#111827"/>
      <circle cx="160" cy="180" r="14" fill="#38bdf8"/>
      <circle cx="240" cy="180" r="14" fill="#38bdf8"/>
      <path d="M150 230 L180 230 L195 210 L210 245 L225 230 L250 230" fill="none" stroke="#34d399" stroke-width="6"/>
      <circle cx="200" cy="40" r="8" fill="#ff5b1f"/>
    </svg>
    <svg class="sil" viewBox="0 0 400 400" width="64" height="64">
      <rect x="70" y="70" width="260" height="260" rx="36" fill="#ff5b1f"/>
      <circle cx="160" cy="180" r="14" fill="#38bdf8"/>
      <circle cx="240" cy="180" r="14" fill="#38bdf8"/>
    </svg>
  </main>
</body>
</html>
